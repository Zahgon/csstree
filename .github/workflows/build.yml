name: Build

on:
    push:
    pull_request:

env:
    PRIMARY_GO_VERSION: "1.23"

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version: ${{ env.PRIMARY_GO_VERSION }}
            - name: gofmt
              run: test -z "$(gofmt -l .)"
            - run: go vet ./...

    unit-tests:
        name: Unit tests
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                go-version: ["1.23", "1.24", "stable"]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version: ${{ matrix.go-version }}
            - run: go build ./...
            - run: go test ./...

    coverage:
        name: Collect coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version: ${{ env.PRIMARY_GO_VERSION }}
            - run: go test -coverprofile=coverage.out ./...
            - run: go tool cover -func=coverage.out | tail -n 1
